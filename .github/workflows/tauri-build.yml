name: Tauri build checks
on:
  push:
    branches: ["codex/tauri-desktop"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'mac' && 'aarch64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - run: npm ci
      - run: npm test
      - if: matrix.platform == 'windows'
        run: npm run dist
      - if: matrix.platform == 'mac'
        run: npm run dist:mac
      - if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Finger Loop Studio.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo "$app/Contents/MacOS/finger-loop-studio" -verify_arch arm64
          plutil -extract NSCameraUsageDescription raw "$app/Contents/Info.plist"
          "$app/Contents/MacOS/finger-loop-studio" > "$RUNNER_TEMP/finger-loop.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:49185/ > /dev/null; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$RUNNER_TEMP/finger-loop.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:49185/vendor/hand_landmarker.task -o /dev/null
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/Finger-Loop-Studio-Mac-arm64.zip"
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "src-tauri/target/release/finger-loop-studio.exe" -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i=0; $i -lt 30; $i++) {
              try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:49185/; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) { throw 'App server did not start' }
            $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:49185/vendor/hand_landmarker.task
            if ($r.StatusCode -ne 200) { throw 'Offline model not served' }
          } finally { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: finger-loop-${{ matrix.platform }}
          path: ${{ matrix.platform == 'windows' && 'src-tauri/target/release/finger-loop-studio.exe' || format('{0}/Finger-Loop-Studio-Mac-arm64.zip', runner.temp) }}
          if-no-files-found: error
