name: Build release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - if: matrix.platform == 'windows'
        run: npm run dist
      - if: matrix.platform == 'mac'
        run: npm run dist:mac
      - if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          unzip -q release/*arm64-mac.zip -d "$RUNNER_TEMP/finger-loop-test"
          app="$RUNNER_TEMP/finger-loop-test/Finger Loop Studio.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -verify_arch arm64 "$app/Contents/MacOS/Finger Loop Studio"
          plutil -extract NSCameraUsageDescription raw "$app/Contents/Info.plist"
          "$app/Contents/MacOS/Finger Loop Studio" > "$RUNNER_TEMP/finger-loop.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:49185/ > /dev/null; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then cat "$RUNNER_TEMP/finger-loop.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:49185/vendor/hand_landmarker.task -o /dev/null
          curl --fail --silent http://127.0.0.1:49185/vendor/wasm/vision_wasm_internal.wasm -o /dev/null
      - if: matrix.platform == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/*Windows-x64.exe --clobber
      - if: matrix.platform == 'mac'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/*.zip --clobber
